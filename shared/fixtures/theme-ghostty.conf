# Literal appearance settings; behavioral settings are not imported.
background = #102030cc
foreground = #e0e1e2
cursor-color = #abcdef
selection-background = #304050
palette = 1=#cc3322
palette = 5=#aa44bb
palette = 13=#ff88ee
font-family = JetBrains Mono
font-family = monospace
font-size = 15
background-opacity = 0.9
cursor-style = bar
cursor-style-blink = false
window-padding-x = 16
window-padding-y = 10
command = ignored-program
config-file = ignored-file
keybind = ctrl+a=ignored-action
