[package]
name = "skylight-runtime"
version.workspace = true
edition.workspace = true
license-file = "../../../LICENSE.md"

[dependencies]
anyhow = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
which = "8"
base64 = "0.22"


[target.'cfg(unix)'.dependencies]
libc = "0.2"
