name: Windows and Linux preview

on:
  pull_request:
    paths: ['desktop/**', 'shared/**', '.github/workflows/portable.yml']
  push:
    branches: [main]
    paths: ['desktop/**', 'shared/**', '.github/workflows/portable.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Run on the public mirror so this matrix never uses private-repo minutes.
    if: ${{ !github.event.repository.private }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Real PTY and shared-format tests
        timeout-minutes: 3
        run: cargo test --locked -p skylight-runtime -- --nocapture
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Package Linux preview
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles deb
      - name: Package Windows preview
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - name: Install native app test driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Match Windows driver to WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./e2e/install-edge-driver.ps1
      - name: Exercise Linux app
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: xvfb-run -a -s '-screen 0 1440x1000x24' node e2e/smoke.mjs
      - name: Exercise Windows app
        if: runner.os == 'Windows'
        timeout-minutes: 6
        run: node e2e/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skylight-ui-evidence-${{ matrix.os }}
          if-no-files-found: warn
          path: desktop/e2e/results/
      - uses: actions/upload-artifact@v4
        with:
          name: skylight-preview-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/target/release/bundle/deb/*.deb
            desktop/target/release/bundle/nsis/*.exe
